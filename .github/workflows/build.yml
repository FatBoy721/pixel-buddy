# Builds Pixel Buddy for Windows and Mac on GitHub's machines.
# Push a tag (v1.0.1, v1.1.0...) and this publishes a Release with the zips his
# in-app updater looks for. Without a tag it just leaves them under "Artifacts".
# The asset names here must match ASSET in update.py.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write        # needed to create the Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: PixelBuddy-windows.zip
          - os: macos-latest
            asset: PixelBuddy-mac.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller packaging/pixel_buddy.spec --noconfirm --distpath dist --workpath build/pyinstaller

      # Zip the build itself, so the updater unpacks a folder it can swap in place.
      - name: Zip the build (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist\Pixel Buddy" -DestinationPath "${{ matrix.asset }}"
      - name: Zip the build (Mac)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Pixel Buddy.app" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PixelBuddy-${{ runner.os }}
          path: ${{ matrix.asset }}

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
          generate_release_notes: true

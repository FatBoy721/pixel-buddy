# Builds Pixel Buddy for Windows and Mac on GitHub's machines (push to GitHub, then
# download the zips from the run's "Artifacts"). Run it by hand: Actions -> build -> Run workflow.
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python packaging/make_icons.py
      - run: pyinstaller packaging/pixel_buddy.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - uses: actions/upload-artifact@v4
        with:
          name: PixelBuddy-${{ runner.os }}
          path: dist/
